version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fortexa_gourmet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: fortexa_gourmet
      DB_USER: postgres
      DB_PASS: postgres

  frontend:
    build: ./frontend
    ports:
      - "3002:80"
    depends_on:
      - api

volumes:
  pgdata:
