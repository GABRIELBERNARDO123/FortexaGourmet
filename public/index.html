<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortexaGourmet</title>
    <link rel="icon" href="assets/favicon.ico?v=8" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="api.js?v=10"></script>
    
    <style>
        :root {
            --font-title: 'Montserrat', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif;
            --bg: #0f0e0c; --bg-side: #0b0a09; --surface: #181613; --surface-2: #211e19;
            --line: #2d2923; --line-strong: #433d33; --text: #f6f1e7; --text-2: #bdb4a3; --text-3: #8d8574;
            --accent: #ffa400; --accent-text: #ffa400; --on-accent: #1b1100;
            --ok: #6cc58a; --err: #ff6b5e; --info: #72b4e6;
            --shadow: 0 10px 30px rgba(0,0,0,0.35); --radius: 16px; --transition: 0.16s ease;
        }
        [data-tema="claro"] {
            --bg: #f4f3f0; --bg-side: #ffffff; --surface: #ffffff; --surface-2: #f0eee9;
            --line: #e3e0d8; --line-strong: #cbc6b9; --text: #1c1812; --text-2: #5b5446; --text-3: #6f6757;
            --accent: #ffa400; --accent-text: #9a5b00; --on-accent: #231600;
            --ok: #1f7a45; --err: #c4372a; --info: #1f6aa8;
        }
        [data-tema="minimal"] {
            --bg: #1a1814; --bg-side: #151310; --surface: #1f1c17; --surface-2: #27241e;
            --line: #332f27; --line-strong: #4a443a; --text: #bdb29b; --text-2: #a69c87; --text-3: #958c78;
            --accent: #be892d; --accent-text: #d19a3e; --on-accent: #1a1408;
            --ok: #7fa883; --err: #c9776b; --info: #7c9fb8;
            font-size: 17px; line-height: 1.65;
        }
        [data-tema="minimal"] * { animation: none !important; transition: none !important; box-shadow: none !important; text-shadow: none !important; filter: none !important; backdrop-filter: none !important; }
        
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background var(--transition), color var(--transition); }
        h1, h2, h3, h4 { font-family: var(--font-title); font-weight: 700; color: var(--text); }
        button, input, select, textarea { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: none; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        table { width: 100%; border-collapse: collapse; color: inherit; font: inherit; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
        th { font-weight: 700; color: var(--text-2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .input-group label { font-size: 0.75rem; color: var(--text-2); font-weight: 700; text-transform: uppercase; }
        input, select, textarea { width: 100%; min-height: 44px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); transition: all var(--transition); }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(255,164,0,0.1); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; transition: all var(--transition); }
        .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 12px rgba(255,164,0,0.2); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-outline { border: 1px solid var(--line-strong); color: var(--text); background: transparent; }
        .btn-outline:hover { background: var(--surface-2); }
        .btn-danger { background: rgba(255,107,94,0.1); color: var(--err); border: 1px solid rgba(255,107,94,0.2); }
        .btn-danger:hover { background: rgba(255,107,94,0.2); }
        .btn-sm { min-height: 32px; padding: 0 12px; font-size: 0.8rem; border-radius: 8px; }
        
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
        .badge.ok { background: rgba(108,197,138,0.1); color: var(--ok); border-color: rgba(108,197,138,0.2); }
        .badge.err { background: rgba(255,107,94,0.1); color: var(--err); border-color: rgba(255,107,94,0.2); }
        .badge.warn { background: rgba(255,164,0,0.1); color: var(--accent-text); border-color: rgba(255,164,0,0.2); }
        
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
        .card-title { font-size: 0.75rem; color: var(--text-2); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .card-value { font-size: 2rem; font-family: var(--font-title); font-weight: 700; }
        
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        #app { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg-side); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; transition: all var(--transition); z-index: 10; }
        .sidebar-header { padding: 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
        .brand-text { font-family: var(--font-title); font-weight: 800; font-size: 1.2rem; display: flex; flex-direction: column; line-height: 1.1; }
        .brand-text span:last-child { color: var(--accent); text-transform: uppercase; font-size: 1.4rem; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-2); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all var(--transition); }
        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: rgba(255,164,0,0.1); color: var(--accent-text); border-left: 3px solid var(--accent); }
        .nav-item .icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .sidebar-footer { padding: 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
        .theme-selector { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; border: 1px solid var(--line); }
        .theme-btn { flex: 1; padding: 8px; font-size: 0.75rem; font-weight: 700; color: var(--text-2); border-radius: 8px; text-align: center; }
        .theme-btn.active { background: var(--surface-2); color: var(--accent-text); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .topbar { height: 80px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid var(--line); flex-shrink: 0; }
        .topbar-title h1 { font-size: 1.5rem; }
        .topbar-title p { font-size: 0.85rem; color: var(--text-2); }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .view-container { flex: 1; overflow-y: auto; padding: 32px; }
        .view-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
        
        .mesa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        .mesa-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all var(--transition); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .mesa-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow); }
        .mesa-card.ocupada { border-color: var(--accent-text); background: linear-gradient(180deg, var(--surface) 0%, rgba(255,164,0,0.05) 100%); }
        .mesa-card h4 { font-size: 1.2rem; }
        .mesa-card .mesa-status { font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
        .mesa-card.ocupada .mesa-status { color: var(--accent-text); border-color: var(--accent-text); }
        
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
        #modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform var(--transition); }
        #modal-overlay.active .modal { transform: scale(1); }
        .modal-header { padding: 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 24px; overflow-y: auto; }
        .modal-footer { padding: 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 12px; background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
        
        #toast-container { position: fixed; bottom: 32px; right: 32px; display: flex; flex-direction: column; gap: 12px; z-index: 2000; }
        .toast { background: var(--surface); border: 1px solid var(--line-strong); border-left: 4px solid var(--info); color: var(--text); padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: 700; animation: slideIn 0.3s ease forwards; }
        .toast.ok { border-left-color: var(--ok); }
        .toast.err { border-left-color: var(--err); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background-image: radial-gradient(circle at top right, rgba(255,164,0,0.1), transparent 40%); }
        .login-card { width: 100%; max-width: 420px; padding: 48px 40px; text-align: center; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .login-card img { width: 120px; height: 120px; border-radius: 24px; object-fit: contain; margin: 0 auto 24px; display: block; }
        .login-card h1 { font-size: 2rem; margin-bottom: 8px; font-weight: 800; }
        .login-card p { color: var(--text-2); margin-bottom: 32px; font-size: 0.9rem; }
        
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .sidebar, .topbar, .btn, .no-print { display: none !important; }
            .cupom-termico { width: 80mm; margin: 0 auto; font-family: 'Courier New', monospace; font-size: 12px; }
            .cupom-termico h2 { font-size: 16px; text-align: center; margin-bottom: 4px; }
            .cupom-termico .linha { border-bottom: 1px dashed #000; margin: 8px 0; }
            .cupom-termico table { width: 100%; font-size: 12px; }
            .cupom-termico th { text-align: left; padding: 4px 0; }
            .cupom-termico td { padding: 4px 0; }
        }
    </style>
</head>
<body data-tema="escuro" data-menu="aberto">

    <div id="login-screen">
        <div class="login-card">
            <img src="assets/logo-login.png" alt="FortexaGourmet" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23ffa400\' stroke-width=\'2\'><path d=\'M8 22H16M12 11V22M5 11L12 2L19 11H5Z\'/></svg>';">
            <h1>Fortexa<span style="color: var(--accent);">GOURMET</span></h1>
            <p>Acesse sua conta</p>
            <div style="text-align: left; margin-top: 24px;">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="admin@fortexa.com" value="admin@fortexa.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" placeholder="••••••••" value="admin123">
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 16px; padding: 16px; font-size: 1rem;" onclick="fazerLogin()" id="btn-login">Entrar no Sistema</button>
        </div>
    </div>

    <div id="app" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="assets/logo-sidebar.png" alt="Logo" style="width: 40px; height: 40px; object-fit: contain;" onerror="this.style.display='none';">
                    <div class="brand-text">
                        <span>Fortexa</span>
                        <span>GOURMET</span>
                    </div>
                </div>
            </div>
            
            <nav class="sidebar-nav" id="nav-menu"></nav>
            
            <div class="sidebar-footer">
                <div class="theme-selector">
                    <button class="theme-btn active" data-theme-set="escuro" onclick="setTheme('escuro')">Escuro</button>
                    <button class="theme-btn" data-theme-set="claro" onclick="setTheme('claro')">Claro</button>
                    <button class="theme-btn" data-theme-set="minimal" onclick="setTheme('minimal')">Minimal</button>
                </div>
                <button class="btn btn-danger" style="width: 100%;" onclick="fazerLogout()">Sair do Sistema</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <h1 id="page-title">Comandas</h1>
                    <p id="page-subtitle">Gerencie o salão e os pedidos</p>
                </div>
                <div class="topbar-right">
                    <span class="badge warn" id="salon-badge">Salão (0)</span>
                    <span class="badge" id="date-chip"></span>
                </div>
            </header>
            <div class="view-container" id="view-container"></div>
        </main>
    </div>

    <div id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
    </div>
    <div id="toast-container"></div>

    <script src="app.js?v=2"></script>
</body>
</html>
